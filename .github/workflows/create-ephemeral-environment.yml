name: Build docker image and release with Octopus

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  REGISTRY_NAME: ${{ secrets.CONTAINER_REGISTRY_NAME }}
  REGISTRY: ${{ secrets.CONTAINER_REGISTRY_URL }}
  IMAGE_NAME: OctopusDeployTesting/dad-joker-2000
  OCTOPUS_SPACE: Demo

jobs:
  build:
    name: Build and push docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: get_release_version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"

      - name: test Get branch names
        id: branch_names
        uses: OctopusDeploy/util-actions/current-branch-name@cat/125029/update-to-node-24
      
      - name: Test add-changeset
        uses: OctopusDeploy/util-actions/add-changeset@cat/125029/update-to-node-24
        with:
          type: patch
          summary: Test changeset for manual testing
          ignore: |
            node_modules/**
            **/__tests__/**
      
      - name: Test find-and-replace-all (string)
        id: find_replace_string
        uses: OctopusDeploy/util-actions/find-and-replace-all@cat/125029/update-to-node-24
        with:
          source: The quick brown fox jumps over the lazy dog
          searchString: the
          replace: hoorooy
      
      - name: Test find-and-replace-all (regex)
        id: find_replace_regex
        uses: OctopusDeploy/util-actions/find-and-replace-all@cat/125029/update-to-node-24
        with:
          source: The quick brown fox jumps over the lazy dog
          searchRegex: the
          searchRegexFlags: i
          replace: hooray

      - name: Test extract-package-details
        id: extract_package
        uses: OctopusDeploy/util-actions/extract-package-details@cat/125029/update-to-node-24
        with:
          path: ./app/package.json